<body>

<script>
const API = "https://api.inaturalist.org/v1";
const MATCH_SCAN_PAGE_SIZE = 200;
const MATCH_SCAN_CONCURRENCY = 3;
const CATALOG_DATABASE_NAME = "sequencedfungisite-catalog";
const CATALOG_DATABASE_VERSION = 1;
const CATALOG_REFRESH_TTL_MS = 24 * 60 * 60 * 1000;
const CATALOG_IMPORT_BATCH_SIZE = 2500;
const CATALOG_PREVIEW_RECORDS = 2000;
const CATALOG_IMPORT_PROGRESS_INTERVAL = 10000;
const GLOBAL_SEQUENCE_CACHE_PREFIX = "sequencedfungisite:global-sequence:v1:";
const GLOBAL_SEQUENCE_CACHE_TTL_MS = 30 * 60 * 1000;
const REVIEW_CATEGORIES = [
  "species-required",
  "mismatched-identifications",
  "not-research-grade"
];
const initialPageParams = new URLSearchParams(window.location.search);
const reviewMode = initialPageParams.get("review_mode") === "1";
let reviewCategory = REVIEW_CATEGORIES.includes(
  initialPageParams.get("inat_review_category")
)
  ? initialPageParams.get("inat_review_category")
  : REVIEW_CATEGORIES[0];
let reviewResultCount = 0;
if (reviewMode) {
  document.body.classList.add("review-mode");
  const reviewFilters = document.getElementById("reviewFilters");
  const reviewFiltersSummary = reviewFilters.querySelector("summary");
  reviewFilters.open = false;
  reviewFiltersSummary.textContent = "Show filters";
  reviewFilters.addEventListener("toggle", () => {
    reviewFiltersSummary.textContent = reviewFilters.open ? "Hide filters" : "Show filters";
  });
}

function fetchApi(url) {
  if (typeof google === "undefined" || !google.script?.run) {
    return fetch(url);
  }

  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(result => resolve({
        ok: result.ok,
        status: result.status,
        json: async () => result.data
      }))
      .withFailureHandler(error => reject(new Error(error.message || String(error))))
      .fetchINaturalist(url);
  });
}

let observations = [];
let observationDataVersion = 0;
let catalogMode = false;
let catalogRecords = null;
let catalogLoadPromise = null;
let catalogDataPartial = false;
let sequenceSummaryCacheVersion = -1;
let sequenceSummaryCache = new Map();
let page = 1;
let loading = false;
let searchHasBeenSubmitted = false;
let sharedObservationId = null;
let lastRenderedResultCount = null;
let totalSearchResults = 0;
let resultsPerPage = 30;
let globalSequenceResults = false;
let globalSequence = "";
let matchThreshold = 0;
const globalSequenceStates = new Map();
let globalSequenceCacheStorageDisabled = false;
const globalSequenceCheckQueue = [];
let globalSequenceChecksInFlight = 0;
let selectedTaxonId = null;
let selectedTaxonName = "";
let taxonSearchTimer;
let taxonSearchRequest = 0;
let selectedPlaceId = null;
let placeSearchTimer;
let placeSearchRequest = 0;
let selectedObserverId = null;
let selectedObserverLogin = "";
let userSearchTimer;
let userSearchRequest = 0;
let selectedProjectId = null;
let selectedProjectTitle = "";
let projectSearchTimer;
let projectSearchRequest = 0;

function setLoading(isLoading, message = "Loading observations...") {
  loading = isLoading;
  const indicator = document.getElementById("loadingIndicator");
  indicator.hidden = !isLoading;
  if (isLoading) {
    document.getElementById("loadingMessage").textContent = message;
    const status = document.getElementById("status");
    status.textContent = "";
    status.hidden = true;
  }
  updateNoResultsMessage();
}

function showStatusError(message) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.hidden = false;
}

function updateNoResultsMessage() {
  const noResults = document.getElementById("noResults");
  noResults.hidden = !(
    (searchHasBeenSubmitted || reviewMode) &&
    !loading &&
    !catalogDataPartial &&
    lastRenderedResultCount === 0
  );
}

async function shareObservation(observation, button) {
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("observation_id", String(observation.id));
  const name = observation.taxon?.name || observation.species_guess || "fungal observation";
  const shareData = {
    title: name,
    text: "View this iNaturalist observation in the Sequenced Fungi Explorer.",
    url: url.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url.href);
      button.textContent = "Link copied";
      setTimeout(() => {
        if (button.isConnected) button.textContent = "Share";
      }, 2000);
    } else {
      window.prompt("Copy this link to share the observation:", url.href);
    }
  } catch (error) {
    if (error.name === "AbortError") return;
    console.error("Could not share the observation.", error);
    showStatusError("Could not share this observation: " + error.message);
  }
}

function scrollToSharedObservation() {
  if (!sharedObservationId) return;
  const card = document.getElementById("observation-" + sharedObservationId);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.focus({ preventScroll: true });
}

function normalizeDNASequence(value) {
  if (!value) return "";

  const sequence = String(value)
    .replace(/^>.*$/gm, "")
    .replace(/\s+/g, "")
    .toUpperCase();

  return sequence.length >= 100 && /^[ACGTURYSWKMBDHVN.-]+$/.test(sequence)
    ? sequence
    : "";
}

function getObservationDNASequence(observation) {
  if (observation.sequence) return normalizeDNASequence(observation.sequence);
  const fieldValue = observation.ofvs?.find(value =>
    Number(value.field_id) === 2330
  ) || observation.observation_field_values?.find(value =>
    Number(value.observation_field?.id) === 2330
  );
  return normalizeDNASequence(fieldValue?.value);
}


function openCatalogDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(
      CATALOG_DATABASE_NAME,
      CATALOG_DATABASE_VERSION
    );
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains("observations")) {
        const store = database.createObjectStore("observations", {
          keyPath: ["catalogVersion", "id"]
        });
        store.createIndex("catalogVersion", "catalogVersion");
      }
      if (!database.objectStoreNames.contains("metadata")) {
        database.createObjectStore("metadata", { keyPath: "key" });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function requestResult(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function transactionComplete(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error || new Error("Catalog storage was aborted."));
  });
}

async function getCatalogMetadata(database) {
  const transaction = database.transaction("metadata", "readonly");
  return requestResult(transaction.objectStore("metadata").get("catalog"));
}

async function getCatalogRecords(database, version) {
  const transaction = database.transaction("observations", "readonly");
  return requestResult(
    transaction.objectStore("observations")
      .index("catalogVersion")
      .getAll(version)
  );
}

async function putCatalogBatch(database, records) {
  const transaction = database.transaction("observations", "readwrite");
  const store = transaction.objectStore("observations");
  records.forEach(record => store.put(record));
  await transactionComplete(transaction);
}

async function saveCatalogMetadata(database, metadata) {
  const transaction = database.transaction("metadata", "readwrite");
  transaction.objectStore("metadata").put({ key: "catalog", ...metadata });
  await transactionComplete(transaction);
}

async function deleteOldCatalogVersions(database, currentVersion) {
  const transaction = database.transaction("observations", "readwrite");
  const store = transaction.objectStore("observations");
  const request = store.openCursor();
  request.onsuccess = () => {
    const cursor = request.result;
    if (!cursor) return;
    if (cursor.value.catalogVersion !== currentVersion) cursor.delete();
    cursor.continue();
  };
  await transactionComplete(transaction);
}

async function importCatalog(database, catalogUrl, manifest, onProgress) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser does not support gzip catalog downloads.");
  }
  const response = await fetch(catalogUrl, { cache: "no-cache" });
  if (!response.ok) {
    throw new Error("Catalog download failed: " + response.status);
  }
  if (!response.body) {
    throw new Error("The browser could not stream the catalog download.");
  }

  const stream = response.body.pipeThrough(new DecompressionStream("gzip"));
  const reader = stream.getReader();
  const decoder = new TextDecoder();
  let pendingText = "";
  let batch = [];
  const records = [];
  let imported = 0;

  async function saveLine(line) {
    if (!line) return;
    const record = JSON.parse(line);
    record.catalogVersion = manifest.catalog_version;
    records.push(record);
    batch.push(record);
    imported++;
    if (batch.length >= CATALOG_IMPORT_BATCH_SIZE) {
      await putCatalogBatch(database, batch);
      batch = [];
    }
    if (
      imported === CATALOG_PREVIEW_RECORDS ||
      imported % CATALOG_IMPORT_PROGRESS_INTERVAL === 0
    ) {
      onProgress?.(records, imported, Number(manifest.records), false);
    }
  }

  try {
    while (true) {
      const { done, value } = await reader.read();
      pendingText += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = pendingText.split("\n");
      pendingText = lines.pop();
      for (const line of lines) await saveLine(line.trim());
      if (done) break;
    }
    await saveLine(pendingText.trim());
    if (batch.length) await putCatalogBatch(database, batch);
  } catch (error) {
    try {
      await reader.cancel();
    } catch (cancelError) {
      console.warn("Could not cancel the failed catalog stream.", cancelError);
    }
    throw error;
  }

  if (imported !== Number(manifest.records)) {
    throw new Error(
      "Catalog record count mismatch: expected " + manifest.records +
      ", imported " + imported + "."
    );
  }

  await saveCatalogMetadata(database, {
    version: manifest.catalog_version,
    count: imported,
    cachedAt: Date.now(),
    generatedAt: manifest.generated_at
  });
  await deleteOldCatalogVersions(database, manifest.catalog_version);
  return records;
}

async function loadStaticCatalog(onProgress) {
  if (window.location.protocol === "file:" || !("indexedDB" in window)) {
    return null;
  }

  const database = await openCatalogDatabase();
  const metadata = await getCatalogMetadata(database);
  let cachedRecords = [];
  if (metadata) {
    cachedRecords = await getCatalogRecords(database, metadata.version);
    if (cachedRecords.length !== Number(metadata.count)) cachedRecords = [];
    if (cachedRecords.length) {
      onProgress?.(
        cachedRecords,
        cachedRecords.length,
        cachedRecords.length,
        true
      );
    }
  }

  const baseUrl = new URL("data/", new URL(".", window.location.href));
  let manifestResponse;
  try {
    manifestResponse = await fetch(
      new URL("manifest.json", baseUrl),
      { cache: "no-cache" }
    );
  } catch (error) {
    if (cachedRecords.length) {
      showStatusError(
        "Could not check for a catalog update; using cached data from " +
        new Date(metadata.generatedAt).toLocaleString() + "."
      );
      console.warn("Could not check for a catalog update.", error);
      return cachedRecords;
    }
    throw error;
  }
  if (manifestResponse.status === 404) {
    if (cachedRecords.length) {
      showStatusError(
        "Static catalog unavailable; using cached data from " +
        new Date(metadata.generatedAt).toLocaleString() + "."
      );
      return cachedRecords;
    }
    return null;
  }
  if (!manifestResponse.ok) {
    throw new Error("Catalog manifest request failed: " + manifestResponse.status);
  }

  const manifest = await manifestResponse.json();
  if (
    manifest.schema_version !== 1 ||
    !manifest.catalog_version ||
    !manifest.catalog_file ||
    !Number.isFinite(Number(manifest.records))
  ) {
    throw new Error("The published catalog manifest is invalid.");
  }

  if (metadata && cachedRecords.length) {
    const isFresh = Date.now() - metadata.cachedAt < CATALOG_REFRESH_TTL_MS;
    if (metadata.version === manifest.catalog_version || isFresh) {
      return cachedRecords;
    }
  }

  try {
    const records = await importCatalog(
      database,
      new URL(manifest.catalog_file, baseUrl),
      manifest,
      cachedRecords.length ? null : onProgress
    );
    return records;
  } catch (error) {
    if (cachedRecords.length) {
      showStatusError(
        "Catalog refresh failed; using cached data from " +
        new Date(metadata.generatedAt).toLocaleString() + "."
      );
      console.error("Could not refresh the local observation catalog.", error);
      return cachedRecords;
    }
    throw error;
  }
}

async function ensureStaticCatalog(onProgress) {
  if (catalogRecords) return catalogRecords;
  if (!catalogLoadPromise) {
    catalogLoadPromise = loadStaticCatalog(onProgress);
  }
  try {
    catalogRecords = await catalogLoadPromise;
    return catalogRecords;
  } catch (error) {
    catalogLoadPromise = null;
    throw error;
  }
}

async function loadObservations(reset = true) {
  if (loading) {
    if (catalogDataPartial) {
      page = 1;
      renderObservations();
      updateMoreButton();
    }
    return;
  }
  setLoading(true);
  let catalogAvailable = false;

  if (reset) {
    page = 1;
    observations = [];
    lastRenderedResultCount = null;
    observationDataVersion++;
    globalSequenceResults = false;
    globalSequence = "";
    catalogDataPartial = false;
    document.getElementById("results").innerHTML = "";
    document.getElementById("moreButton").style.display = "none";
  }

  try {
    validateObservationIds();
    const catalog = await ensureStaticCatalog((records, loaded, _total, cached) => {
      if (cached) {
        observations = records;
        catalogMode = true;
        catalogDataPartial = false;
        globalSequenceStates.clear();
        observationDataVersion++;
        catalogAvailable = true;
        renderObservations();
        updateMoreButton();
        scrollToSharedObservation();
        return;
      }

      if (!catalogDataPartial && loaded >= CATALOG_PREVIEW_RECORDS) {
        catalogDataPartial = true;
        observations = records.slice(0, CATALOG_PREVIEW_RECORDS);
        catalogMode = true;
        globalSequenceStates.clear();
        observationDataVersion++;
        renderObservations();
        updateMoreButton();
        scrollToSharedObservation();
      }
    });
    if (!catalog) {
      catalogMode = false;
      setLoading(false);
      return await loadObservationsFromApi(reset);
    }

    catalogDataPartial = false;
    globalSequenceStates.clear();
    observations = catalog;
    catalogMode = true;
    observationDataVersion++;
    catalogAvailable = true;
    renderObservations();
    updateMoreButton();

    await resolveTaxonFilter();
    await resolveObserverFilter();
    await resolveProjectFilter();
    renderObservations();
    updateMoreButton();
    scrollToSharedObservation();
  } catch (error) {
    if (catalogAvailable) {
      showStatusError(
        "Catalog results are available, but the latest catalog or a filter lookup failed: " +
        error.message
      );
      console.error("Could not update the catalog or resolve a filter.", error);
    } else if (catalogDataPartial && observations.length) {
      showStatusError("Catalog caching failed; the displayed preview is incomplete.");
      console.error("Could not finish caching the local observation catalog.", error);
      updateMoreButton();
    } else {
      showStatusError("Error loading the local observation catalog: " + error.message);
      if (reviewMode) updateMoreButton();
    }
  } finally {
    setLoading(false);
  }
}

async function loadObservationsFromApi(reset = true) {
  if (loading) return;
  setLoading(true);
  catalogMode = false;

  if (reset) {
    page = 1;
    observations = [];
    lastRenderedResultCount = null;
    observationDataVersion++;
    globalSequenceResults = false;
    globalSequence = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("moreButton").style.display = "none";
  }

  try {
    validateObservationIds();
    await resolveTaxonFilter();
    await resolveObserverFilter();
    await resolveProjectFilter();
    const pageSize = reviewMode ? MATCH_SCAN_PAGE_SIZE : resultsPerPage;
    const searchParams = buildSearchParams(false);
    const params = configureObservationParams(
      new URLSearchParams(searchParams),
      reviewMode ? 1 : page,
      pageSize
    );
    const response = await fetchApi(API + "/observations?" + params);

    if (!response.ok) {
      throw new Error("API error: " + response.status);
    }

    const data = await response.json();
    const results = Array.isArray(data) ? data : data.results || [];
    observations.push(...results);

    totalSearchResults = Number.isFinite(data.total_results)
      ? data.total_results
      : observations.length;

    if (reviewMode) {
      const pageCount = Math.ceil(totalSearchResults / pageSize);
      for (let firstPageInBatch = 2; firstPageInBatch <= pageCount; firstPageInBatch += MATCH_SCAN_CONCURRENCY) {
        const pageNumbers = Array.from(
          { length: Math.min(MATCH_SCAN_CONCURRENCY, pageCount - firstPageInBatch + 1) },
          (_, index) => firstPageInBatch + index
        );
        const pages = await Promise.all(pageNumbers.map(async pageNumber => {
          const pageParams = configureObservationParams(
            new URLSearchParams(searchParams),
            pageNumber,
            pageSize
          );
          const pageResponse = await fetchApi(API + "/observations?" + pageParams);
          if (!pageResponse.ok) throw new Error("API error: " + pageResponse.status);
          return pageResponse.json();
        }));
        pages.forEach(pageData => {
          observations.push(...(Array.isArray(pageData) ? pageData : pageData.results || []));
        });
      }
    }

    observationDataVersion++;
    renderObservations();
    scrollToSharedObservation();

    updateMoreButton(results.length > 0);

  } catch (error) {
    showStatusError("Error: " + error.message);
    if (reviewMode) updateMoreButton();
  } finally {
    setLoading(false);
  }
}

function configureObservationParams(params, pageNumber, pageSize) {
  params.delete("iconic_taxa[]");
  params.set("iconic_taxa", "47170");
  params.set("per_page", String(pageSize));
  params.set("page", String(pageNumber));
  return params;
}

function updateMoreButton(hasMoreApiResults = true) {
  if (reviewMode || catalogMode || globalSequenceResults) {
    document.getElementById("moreButton").style.display = "none";
    renderReviewPagination();
    return;
  }
  const hasMore = globalSequenceResults
    ? page * resultsPerPage < totalSearchResults
    : hasMoreApiResults && observations.length < totalSearchResults;
  document.getElementById("moreButton").style.display =
    hasMore ? "inline-block" : "none";
}

function renderReviewPagination() {
  const pagination = document.getElementById("reviewPagination");
  if (!reviewMode && !catalogMode && !globalSequenceResults) {
    pagination.hidden = true;
    return;
  }

  const resultCount = reviewMode ? reviewResultCount : totalSearchResults;
  const pageCount = Math.ceil(resultCount / resultsPerPage);
  pagination.replaceChildren();
  pagination.hidden = pageCount <= 1;
  if (pagination.hidden) return;

  function addPageButton(label, pageNumber, ariaLabel = label) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-label", ariaLabel);
    if (pageNumber === page) button.setAttribute("aria-current", "page");
    button.disabled = pageNumber === page;
    button.addEventListener("click", () => {
      page = pageNumber;
      if (catalogMode || reviewMode || globalSequenceResults) {
        renderObservations();
        updateMoreButton();
      }
    });
    pagination.appendChild(button);
  }

  function addGap() {
    const gap = document.createElement("span");
    gap.className = "review-pagination-gap";
    gap.setAttribute("aria-hidden", "true");
    gap.textContent = "...";
    pagination.appendChild(gap);
  }

  addPageButton("Previous", Math.max(1, page - 1), "Previous page");
  let pageNumbers;
  if (pageCount <= 7) {
    pageNumbers = Array.from({ length: pageCount }, (_, index) => index + 1);
  } else if (page <= 4) {
    pageNumbers = [1, 2, 3, 4, 5, pageCount];
  } else if (page >= pageCount - 3) {
    pageNumbers = [1, pageCount - 4, pageCount - 3, pageCount - 2, pageCount - 1, pageCount];
  } else {
    pageNumbers = [1, page - 1, page, page + 1, pageCount];
  }

  pageNumbers.forEach((pageNumber, index) => {
    if (index && pageNumber - pageNumbers[index - 1] > 1) addGap();
    addPageButton(String(pageNumber), pageNumber);
  });
  addPageButton("Next", Math.min(pageCount, page + 1), "Next page");
}

function notifyReviewHost(message) {
  if (reviewMode && window.parent !== window) {
    window.parent.postMessage(message, "*");
  }
}

function setReviewCategory(category) {
  if (!reviewMode || !REVIEW_CATEGORIES.includes(category) || reviewCategory === category) return;
  reviewCategory = category;
  page = 1;
  saveSearchToHistory();
  reviewResultCount = renderObservations();
  updateMoreButton();
  notifyReviewHost({ type: "review-category-changed", category });
}

function buildGlobalSequenceParams(sequence) {
  const params = new URLSearchParams();
  params.set("field:DNA Barcode ITS", sequence);
  params.set("iconic_taxa[]", "Fungi");
  params.set("order_by", "observed_on");
  params.set("order", "desc");
  return params;
}

async function buildGlobalSequenceCacheKey(sequence) {
  if (!window.crypto?.subtle || typeof TextEncoder === "undefined") return "";
  const digest = await window.crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(sequence)
  );
  const hash = Array.from(new Uint8Array(digest), byte =>
    byte.toString(16).padStart(2, "0")
  ).join("");
  return GLOBAL_SEQUENCE_CACHE_PREFIX + hash;
}

function readGlobalSequenceCache(cacheKey) {
  if (!cacheKey || globalSequenceCacheStorageDisabled) return null;

  try {
    const stored = window.localStorage.getItem(cacheKey);
    if (!stored) return null;

    const cache = JSON.parse(stored);
    if (
      cache.version !== 1 ||
      !Number.isFinite(cache.expiresAt) ||
      cache.expiresAt <= Date.now() ||
      !Array.isArray(cache.speciesMatches)
    ) {
      window.localStorage.removeItem(cacheKey);
      return null;
    }

    return {
      hasMatch: cache.hasMatch === true,
      totalMatches: Number(cache.totalMatches) || 0,
      speciesMatches: cache.speciesMatches,
      checkedAt: cache.expiresAt - GLOBAL_SEQUENCE_CACHE_TTL_MS
    };
  } catch (error) {
    globalSequenceCacheStorageDisabled = true;
    console.warn("Could not read the cached global sequence matches.", error);
    return null;
  }
}

function writeGlobalSequenceCache(cacheKey, result) {
  if (!cacheKey || globalSequenceCacheStorageDisabled) return;

  const speciesMatches = result.speciesMatches.slice(0, 5).map(observation => ({
    id: observation.id,
    taxon: observation.taxon ? {
      id: observation.taxon.id,
      name: observation.taxon.name,
      rank: observation.taxon.rank,
      rank_level: observation.taxon.rank_level
    } : null,
    species_guess: observation.species_guess
  }));

  try {
    window.localStorage.setItem(cacheKey, JSON.stringify({
      version: 1,
      expiresAt: (result.checkedAt || Date.now()) + GLOBAL_SEQUENCE_CACHE_TTL_MS,
      hasMatch: result.hasMatch,
      totalMatches: result.totalMatches,
      speciesMatches
    }));
  } catch (error) {
    globalSequenceCacheStorageDisabled = true;
    console.warn("Could not save the global sequence match cache.", error);
  }
}

async function fetchSequenceMatches(sequence, onProgress) {
  const searchParams = buildGlobalSequenceParams(sequence);
  let totalMatches = 0;

  function filterMatches(records) {
    const exactMatches = records.filter(observation =>
      getObservationDNASequence(observation) === sequence
    );
    totalMatches += exactMatches.length;
    return exactMatches;
  }

  async function fetchPage(pageNumber) {
    const params = configureObservationParams(
      new URLSearchParams(searchParams),
      pageNumber,
      MATCH_SCAN_PAGE_SIZE
    );
    const response = await fetchApi(API + "/observations?" + params);
    if (!response.ok) throw new Error("API error: " + response.status);

    const data = await response.json();
    return {
      records: Array.isArray(data) ? data : data.results || [],
      totalResults: Number(data.total_results) || 0
    };
  }

  const firstPage = await fetchPage(1);
  const records = filterMatches(firstPage.records);
  const totalResults = firstPage.totalResults || firstPage.records.length;
  const pageCount = Math.ceil(totalResults / MATCH_SCAN_PAGE_SIZE);

  for (let firstPageInBatch = 2; firstPageInBatch <= pageCount; firstPageInBatch += MATCH_SCAN_CONCURRENCY) {
    const pageNumbers = Array.from(
      { length: Math.min(MATCH_SCAN_CONCURRENCY, pageCount - firstPageInBatch + 1) },
      (_, index) => firstPageInBatch + index
    );
    const pages = await Promise.all(pageNumbers.map(fetchPage));
    pages.forEach(page => records.push(...filterMatches(page.records)));
    if (onProgress) onProgress(records.length, totalResults);
  }

  return { records, totalResults: records.length, totalMatches };
}

async function checkForGlobalSequenceMatch(sequence, excludedObservationId) {
  let cacheKey = "";
  try {
    cacheKey = await buildGlobalSequenceCacheKey(sequence);
  } catch (error) {
    globalSequenceCacheStorageDisabled = true;
    console.warn("Could not create a key for the global sequence cache.", error);
  }
  const cachedResult = readGlobalSequenceCache(cacheKey);
  if (cachedResult) return cachedResult;

  const searchParams = buildGlobalSequenceParams(sequence);
  let totalMatches = 0;
  let hasMatch = false;
  const speciesMatches = new Map();

  function finishSearch() {
    const result = {
      hasMatch,
      totalMatches,
      checkedAt: Date.now(),
      speciesMatches: getPrioritizedSpeciesMatches(
        [...speciesMatches.values()],
        null
      ).slice(0, 5)
    };
    writeGlobalSequenceCache(cacheKey, result);
    return result;
  }

  async function fetchPage(pageNumber) {
    const params = configureObservationParams(
      new URLSearchParams(searchParams),
      pageNumber,
      MATCH_SCAN_PAGE_SIZE
    );
    const response = await fetchApi(API + "/observations?" + params);
    if (!response.ok) throw new Error("API error: " + response.status);

    const data = await response.json();
    return {
      records: Array.isArray(data) ? data : data.results || [],
      totalResults: Number(data.total_results) || 0
    };
  }

  function hasOtherExactMatch(records) {
    const exactMatches = records.filter(observation =>
      getObservationDNASequence(observation) === sequence
    );
    totalMatches += exactMatches.length;
    exactMatches.forEach(observation => {
      if (String(observation.id) !== String(excludedObservationId)) hasMatch = true;
      if (isSpeciesLevelObservation(observation)) {
        speciesMatches.set(String(observation.id), observation);
      }
    });
  }

  function hasOtherSpeciesLevelMatch() {
    return [...speciesMatches.keys()].some(
      id => id !== String(excludedObservationId)
    );
  }

  const firstPage = await fetchPage(1);
  hasOtherExactMatch(firstPage.records);
  if (hasOtherSpeciesLevelMatch()) {
    return finishSearch();
  }

  const totalResults = firstPage.totalResults || firstPage.records.length;
  const pageCount = Math.ceil(totalResults / MATCH_SCAN_PAGE_SIZE);
  for (let firstPageInBatch = 2; firstPageInBatch <= pageCount; firstPageInBatch += MATCH_SCAN_CONCURRENCY) {
    const pageNumbers = Array.from(
      { length: Math.min(MATCH_SCAN_CONCURRENCY, pageCount - firstPageInBatch + 1) },
      (_, index) => firstPageInBatch + index
    );
    const pages = await Promise.all(pageNumbers.map(fetchPage));
    for (const page of pages) {
      hasOtherExactMatch(page.records);
    }
    if (hasOtherSpeciesLevelMatch()) {
      return finishSearch();
    }
  }

  return finishSearch();
}

function processGlobalSequenceCheckQueue() {
  while (
    globalSequenceChecksInFlight < MATCH_SCAN_CONCURRENCY &&
    globalSequenceCheckQueue.length
  ) {
    const check = globalSequenceCheckQueue.shift();
    globalSequenceChecksInFlight++;
    check();
  }
}

function queueGlobalSequenceCheck(sequence, observationId) {
  if (globalSequenceStates.has(sequence)) return;
  if (catalogMode) {
    const summary = getSequenceSummaries(observations).get(sequence);
    const matches = (summary?.observations || []).filter(
      observation => String(observation.id) !== String(observationId)
    );
    const speciesMatches = getPrioritizedSpeciesMatches(
      matches.filter(isSpeciesLevelObservation),
      null
    ).slice(0, 5);
    globalSequenceStates.set(sequence, {
      status: matches.length ? "matches" : "only",
      totalMatches: summary?.count || 0,
      speciesMatches,
      checkedAt: Date.now()
    });
    return;
  }
  globalSequenceStates.set(sequence, { status: "checking" });
  globalSequenceCheckQueue.push(async () => {
    try {
      const result = await checkForGlobalSequenceMatch(sequence, observationId);
      globalSequenceStates.set(sequence, {
        status: result.hasMatch
          ? "matches"
          : result.totalMatches === 1 ? "only" : "none",
        totalMatches: result.totalMatches,
        speciesMatches: result.speciesMatches,
        checkedAt: result.checkedAt || Date.now()
      });
    } catch (error) {
      globalSequenceStates.set(sequence, {
        status: "error",
        message: error.message,
        checkedAt: Date.now()
      });
      showStatusError("Error checking global genetic matches: " + error.message);
    } finally {
      globalSequenceChecksInFlight--;
      if (!globalSequenceResults) renderObservations();
      processGlobalSequenceCheckQueue();
    }
  });
  processGlobalSequenceCheckQueue();
}

function buildSearchParams(includePaging = false) {
  const params = new URLSearchParams();
  const taxon = document.getElementById("search").value.trim();
  const observationIds = parseObservationIds();
  const sequence = normalizeDNASequence(
    document.getElementById("sequenceFilter").value
  );
  const location = document.getElementById("locationFilter")?.value.trim() || "";
  const observer = document.getElementById("observerFilter").value.trim();
  const project = document.getElementById("projectFilter").value.trim();
  const dateAfter = document.getElementById("dateAfter").value;
  const dateBefore = document.getElementById("dateBefore").value;
  const orderBy = document.getElementById("sortFilter").value;

  params.set("field:DNA Barcode ITS", sequence);
  params.set("iconic_taxa[]", "Fungi");
  params.set("order_by", orderBy === "name" ? "observed_on" : orderBy);
  params.set("order", "desc");

  if (selectedTaxonId) params.set("taxon_id", String(selectedTaxonId));
  else if (taxon) params.set("taxon_name", taxon);
  if (observationIds.length && observationIds.every(id => /^\d+$/.test(id) && Number(id) > 0)) {
    params.set("id", observationIds.join(","));
  }
  if (location && selectedPlaceId) params.set("place_id", String(selectedPlaceId));
  if (observer && selectedObserverId) {
    params.set("user_id", String(selectedObserverId));
  }
  if (project && selectedProjectId) params.set("project_id", String(selectedProjectId));
  if (dateAfter) params.set("d1", dateAfter);
  if (dateBefore) params.set("d2", dateBefore);
  if (document.getElementById("photosFilter")?.checked) params.set("photos", "true");

  if (includePaging) {
    params.set("per_page", String(resultsPerPage));
    params.set("page", String(page));
  }

  return params;
}

function buildPageStateParams() {
  const params = new URLSearchParams();
  params.set("inat_search", document.getElementById("search").value);
  params.set("inat_per_page", String(resultsPerPage));
  params.set("inat_taxon_id", selectedTaxonId === null ? "" : String(selectedTaxonId));

  params.set("inat_sequence", document.getElementById("sequenceFilter").value);
  params.set("inat_location", document.getElementById("locationFilter").value);
  params.set("inat_observer", document.getElementById("observerFilter").value);
  params.set("inat_project", document.getElementById("projectFilter").value);
  params.set("inat_after", document.getElementById("dateAfter").value);
  params.set("inat_before", document.getElementById("dateBefore").value);
  params.set("inat_sort", document.getElementById("sortFilter").value);

function saveSearchToHistory() {
  const url = new URL(window.location.href);
  url.search = buildPageStateParams().toString();
  history.pushState(null, "", url);
}

function restoreSearchFromUrl() {

  if (reviewMode) {
    const savedCategory = params.get("inat_review_category");
    reviewCategory = REVIEW_CATEGORIES.includes(savedCategory)
      ? savedCategory
      : REVIEW_CATEGORIES[0];

      type: "review-category-changed",
      category: reviewCategory
    });

    hasSavedSearch ? params.get("inat_search") || "" : "";
  const taxonId = hasSavedSearch ? params.get("inat_taxon_id") : null;
  selectedTaxonId = taxonId && Number.isFinite(Number(taxonId))
    ? Number(taxonId)
    : null;
  selectedTaxonName = selectedTaxonId ? document.getElementById("search").value : "";
  document.getElementById("observationIds").value =
    hasSavedSearch ? params.get("inat_observation_ids") || "" : "";
  document.getElementById("sequenceFilter").value =
    hasSavedSearch ? params.get("inat_sequence") || "" : "";
  document.getElementById("locationFilter").value =
    hasSavedSearch ? params.get("inat_location") || "" : "";
  document.getElementById("observerFilter").value =
    hasSavedSearch ? params.get("inat_observer") || "" : "";
  document.getElementById("projectFilter").value =
    hasSavedSearch ? params.get("inat_project") || "" : "";
  document.getElementById("dateAfter").value =
    hasSavedSearch ? params.get("inat_after") || "" : "";
  document.getElementById("dateBefore").value =
    hasSavedSearch ? params.get("inat_before") || "" : "";

  const sortFilter = document.getElementById("sortFilter");

  if ([...sortFilter.options].some(option => option.value === sort)) {
    sortFilter.value = sort;
  }
  const savedPageSize = hasSavedSearch ? params.get("inat_per_page") : "30";
  const resultsPerPageFilter = document.getElementById("resultsPerPage");
  if ([...resultsPerPageFilter.options].some(option => option.value === savedPageSize)) {
    resultsPerPageFilter.value = savedPageSize;
  }
  resultsPerPage = Number(resultsPerPageFilter.value);
  const savedThreshold = hasSavedSearch ? params.get("inat_match_threshold") : "0";
  const matchThresholdFilter = document.getElementById("matchThreshold");
  if ([...matchThresholdFilter.options].some(option => option.value === savedThreshold)) {
    matchThresholdFilter.value = savedThreshold;
  }
  matchThreshold = Number(matchThresholdFilter.value);

  const placeId = hasSavedSearch ? params.get("inat_place_id") : null;
  selectedPlaceId = placeId && Number.isFinite(Number(placeId))
    ? Number(placeId)
    : null;
  selectedObserverId = null;
  selectedObserverLogin = "";
  selectedProjectId = null;
  selectedProjectTitle = "";
}

function parseObservationIds() {
  const value = document.getElementById("observationIds").value.trim();
  if (!value) return [];

  return [...new Set(value.split(/[\s,]+/).map(id => id.replace(/^#/, "")))];
}

function validateObservationIds() {
  const ids = parseObservationIds();
  const invalidIds = ids.filter(id => !/^\d+$/.test(id) || Number(id) <= 0);
  if (invalidIds.length) {
    throw new Error("Observation IDs must be positive numbers, separated by commas or spaces.");
  }
}

function taxonRankOrder(rank) {
  return ({ genus: 0, subspecies: 1, species: 2 })[rank] ?? 3;
}

function renderTaxonSuggestions(taxa, suggestions) {
  suggestions.replaceChildren();
  const genera = new Map();
  taxa.forEach(taxon => {
    const genus = taxon.rank === "genus"
      ? taxon.name
      : taxon.name.split(/\s+/)[0];
    if (!genera.has(genus)) genera.set(genus, []);
    genera.get(genus).push(taxon);
  });

  [...genera.keys()].sort((a, b) =>
    a.localeCompare(b, undefined, { sensitivity: "base" })
  ).forEach(genus => {
    const genusTaxon = genera.get(genus).find(taxon => taxon.rank === "genus");
    const genusOption = document.createElement("button");
    genusOption.type = "button";
    genusOption.role = "option";
    genusOption.className = "taxon-genus-suggestion";
    genusOption.textContent = genus + " (genus and all species)";
    genusOption.setAttribute("aria-label", "Select " + genus + ", including all species");
    genusOption.addEventListener("click", () => {
      document.getElementById("search").value = genus;
      selectedTaxonId = genusTaxon?.id || null;
      selectedTaxonName = genusTaxon?.name || "";
      suggestions.hidden = true;
    });
    suggestions.appendChild(genusOption);

    genera.get(genus).sort((a, b) =>
      taxonRankOrder(a.rank) - taxonRankOrder(b.rank) ||
      a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
    ).filter(taxon => taxon.rank !== "genus").forEach(taxon => {
      const option = document.createElement("button");
      option.type = "button";
      option.role = "option";
      option.className = "taxon-suggestion";
      option.dataset.rank = taxon.rank;
      option.textContent = taxon.name;
      option.addEventListener("click", () => {
        document.getElementById("search").value = taxon.name;
        selectedTaxonId = taxon.id;
        selectedTaxonName = taxon.name;
        suggestions.hidden = true;
      });
      suggestions.appendChild(option);
    });
  });
  suggestions.hidden = suggestions.childElementCount === 0;
}

      );

function isSpeciesLevelObservation(observation) {
  const rank = observation.taxon?.rank?.toLowerCase() || "";
  const rankLevel = Number(observation.taxon?.rank_level);
  return ["species", "subspecies", "variety", "form"].includes(rank) ||
    (Number.isFinite(rankLevel) && rankLevel > 0 && rankLevel <= 10);
}

function getPrioritizedSpeciesMatches(records, excludedObservationId) {
  const uniqueMatches = new Map();
  records.forEach(observation => {
    if (String(observation.id) !== String(excludedObservationId)) {
      uniqueMatches.set(String(observation.id), observation);
    }
  });
  return [...uniqueMatches.values()].sort((a, b) => {
    const speciesRankDifference =
      Number(isSpeciesLevelObservation(b)) - Number(isSpeciesLevelObservation(a));
    if (speciesRankDifference) return speciesRankDifference;
    const nameA = a.taxon?.name || a.species_guess || "Unknown identification";
    const nameB = b.taxon?.name || b.species_guess || "Unknown identification";
    return nameA.localeCompare(nameB, undefined, { sensitivity: "base" });
  });
}

function buildSequenceSummaries(records) {
  const summaries = new Map();
  records.forEach(observation => {
    const sequence = getObservationDNASequence(observation);
    if (!sequence) return;

    let summary = summaries.get(sequence);
    if (!summary) {
      summary = { count: 0, observations: [] };
      summaries.set(sequence, summary);
    }
    summary.count++;
    summary.observations.push(observation);
  });
  return summaries;
}

function getSequenceSummaries(records) {
  if (records === observations && sequenceSummaryCacheVersion === observationDataVersion) {
    return sequenceSummaryCache;
  }
  const summaries = buildSequenceSummaries(records);
  if (records === observations) {
    sequenceSummaryCache = summaries;
    sequenceSummaryCacheVersion = observationDataVersion;
  }
  return summaries;
}

function getConflictingSpeciesMatches(observation, sequenceSummary) {
  const isSpeciesLevel = isSpeciesLevelObservation(observation);
  return (sequenceSummary?.observations || []).filter(match => {
    if (String(match.id) === String(observation.id)) return false;
    if (!isSpeciesLevelObservation(match)) return false;
    if (!isSpeciesLevel) return true;
    if (observation.taxon?.id && match.taxon?.id) {
      return String(observation.taxon.id) !== String(match.taxon.id);
    }
    return match.taxon?.name !== observation.taxon?.name;
  });
}

function renderObservations() {
  const filter = document.getElementById("search").value.toLowerCase();
  const observationIds = parseObservationIds();
  const sequenceFilter = normalizeDNASequence(
    document.getElementById("sequenceFilter").value
  );
  const locationFilter = document.getElementById("locationFilter").value.trim();
  const observerFilter = document.getElementById("observerFilter").value.trim();
  const projectFilter = document.getElementById("projectFilter").value.trim();
  const dateAfter = document.getElementById("dateAfter").value;
  const dateBefore = document.getElementById("dateBefore").value;
  const results = document.getElementById("results");

  results.innerHTML = "";

  const sequenceSummaries = getSequenceSummaries(observations);
  let matchingObservations = observations.filter(observation => {
    const taxonId = observation.taxon?.id;
    const ancestorIds = observation.taxon?.ancestor_ids || [];
    const matchesSelectedTaxon = selectedTaxonId === null ||
      String(taxonId) === String(selectedTaxonId) ||
      ancestorIds.some(id => String(id) === String(selectedTaxonId));
    const matchesSpecies = globalSequenceResults ||
      (catalogMode && selectedTaxonId !== null
        ? matchesSelectedTaxon
        : selectedTaxonId !== null ||
          (observation.taxon?.name || "").toLowerCase().includes(filter));
    const matchesObservationId = globalSequenceResults || !observationIds.length ||
      observationIds.includes(String(observation.id));
    const matchesLocation = globalSequenceResults || !catalogMode ||
      !locationFilter || !selectedPlaceId ||
      (observation.place_ids || []).some(
        id => String(id) === String(selectedPlaceId)
      );
    const matchesObserver = globalSequenceResults || !catalogMode ||
      !observerFilter || !selectedObserverId ||
      String(observation.user?.id) === String(selectedObserverId);
    const matchesProject = globalSequenceResults || !catalogMode ||
      !projectFilter || !selectedProjectId ||
      (observation.project_ids || []).some(
        id => String(id) === String(selectedProjectId)
      );
    const observedOn = observation.observed_on || "";
    const matchesDate = globalSequenceResults || !catalogMode ||
      ((!dateAfter || (observedOn && observedOn >= dateAfter)) &&
       (!dateBefore || (observedOn && observedOn <= dateBefore)));
    const sequence = getObservationDNASequence(observation);
    const geneticMatchCount = sequence
      ? (sequenceSummaries.get(sequence)?.count || 0) - 1
      : 0;
    if (!sequence) return false;
    const matchesSequence = globalSequenceResults
      ? sequence === globalSequence
      : (!sequenceFilter || sequence === sequenceFilter) &&
        (matchThreshold === 0 || geneticMatchCount > matchThreshold);
    return matchesSpecies && matchesObservationId && matchesSequence &&
      matchesLocation && matchesObserver && matchesProject && matchesDate;
  });

  if (reviewMode) {
    const reviewSequenceSummaries = reviewCategory === "mismatched-identifications"
      ? catalogMode
        ? sequenceSummaries
        : buildSequenceSummaries(matchingObservations)
      : new Map();
    if (reviewCategory === "mismatched-identifications" && !catalogMode) {
      reviewSequenceSummaries.forEach((summary, sequence) => {
        const globalMatchState = globalSequenceStates.get(sequence);
        if (
          globalMatchState?.checkedAt &&
          Date.now() - globalMatchState.checkedAt < GLOBAL_SEQUENCE_CACHE_TTL_MS
        ) {
          summary.observations.push(...(globalMatchState.speciesMatches || []));
        }
      });
    }
    matchingObservations = matchingObservations.filter(observation => {
      if (reviewCategory === "species-required") {
        return !isSpeciesLevelObservation(observation);
      }
      if (reviewCategory === "mismatched-identifications") {
        const sequence = getObservationDNASequence(observation);
        return getConflictingSpeciesMatches(
          observation,
          reviewSequenceSummaries.get(sequence)
        ).length > 0;
      }
      return observation.quality_grade !== "research";
    });
  }

  if (document.getElementById("sortFilter").value === "name") {
    matchingObservations.sort((a, b) => {
      const nameA = a.taxon?.name || a.species_guess || "Unknown fungus";
      const nameB = b.taxon?.name || b.species_guess || "Unknown fungus";
      return nameA.localeCompare(nameB, undefined, { sensitivity: "base" });
    });
  } else if (catalogMode) {
    const sortField = document.getElementById("sortFilter").value === "created_at"
      ? "created_at"
      : document.getElementById("sortFilter").value === "updated_at"
        ? "updated_at"
        : "observed_on";
    matchingObservations.sort((a, b) =>
      String(b[sortField] || "").localeCompare(String(a[sortField] || ""))
    );
  }

  reviewResultCount = matchingObservations.length;
  lastRenderedResultCount = matchingObservations.length;
  updateNoResultsMessage();
  if (catalogMode) totalSearchResults = matchingObservations.length;
  const visibleObservations = globalSequenceResults || reviewMode || catalogMode
    ? matchingObservations.slice((page - 1) * resultsPerPage, page * resultsPerPage)
    : matchingObservations;

  visibleObservations.forEach(obs => {
      const photo = obs.photos?.[0];
      const imageUrl = photo?.medium_url ||
        (photo?.url ? photo.url.replace("square", "medium") : "");

      const image = imageUrl
        ? '<img src="' + escapeHtml(imageUrl) + '" loading="lazy" alt="">'
        : '<div class="card-no-photo">No photo available</div>';

      const card = document.createElement("article");
      card.className = "card";
      card.id = "observation-" + String(obs.id);
      if (String(obs.id) === sharedObservationId) {
        card.classList.add("shared-observation");
        card.tabIndex = -1;
      }

      card.innerHTML =
        '<div class="card-media">' + image + '</div>' +
        '<div class="card-content">' +
          (sequenceFilter ? '<p class="match-indicator">Exact DNA sequence match</p>' : "") +
          '<h3>' + escapeHtml(obs.taxon?.name || obs.species_guess || "Unknown fungus") + '</h3>' +
          '<p>📅 ' + escapeHtml(obs.observed_on || "Date unknown") + '</p>' +
          '<p>👤 ' + escapeHtml(obs.user?.login || "Unknown observer") + '</p>' +
          '<p class="observation-location">📍 ' + escapeHtml(obs.place_guess || "Location unavailable") + '</p>' +
          '<div class="card-actions">' +
            '<a href="https://www.inaturalist.org/observations/' + encodeURIComponent(obs.id) +
              '" target="_blank" rel="noopener">View on iNaturalist ↗</a>' +
            '<button class="share-button" type="button">Share</button>' +
          '</div>' +
        '</div>';

      const shareButton = card.querySelector(".share-button");
      shareButton.setAttribute("aria-label", "Share observation #" + obs.id);
      shareButton.addEventListener("click", () => shareObservation(obs, shareButton));

      const sequence = getObservationDNASequence(obs);
      if (sequence) {
        const sequenceSummary = sequenceSummaries.get(sequence);
        const isSpeciesLevel = isSpeciesLevelObservation(obs);
        if (!globalSequenceResults) {
          const previousCheck = globalSequenceStates.get(sequence);
          if (
            previousCheck &&
            previousCheck.status !== "checking" &&
            Date.now() - previousCheck.checkedAt >= GLOBAL_SEQUENCE_CACHE_TTL_MS
          ) {
            globalSequenceStates.delete(sequence);
          }
          if (!globalSequenceStates.has(sequence)) {
            queueGlobalSequenceCheck(sequence, obs.id);
          }
        }
        const globalMatchState = globalSequenceResults
          ? null
          : globalSequenceStates.get(sequence);
        const allSequenceMatches = getPrioritizedSpeciesMatches([
          ...sequenceSummary.observations,
          ...(globalMatchState?.speciesMatches || [])
        ], obs.id);
        const sequenceSummaryWithGlobalMatches = {
          observations: allSequenceMatches
        };
        const otherMatches = allSequenceMatches;
        const conflictingMatches = getConflictingSpeciesMatches(
          obs,
          sequenceSummaryWithGlobalMatches
        );
        const displayedMatches = getPrioritizedSpeciesMatches(
          isSpeciesLevel ? conflictingMatches : otherMatches,
          obs.id
        );

        if (!isSpeciesLevel || conflictingMatches.length) {
          const matchContext = document.createElement("div");
          matchContext.className = "match-context" +
            (!isSpeciesLevel ? " unidentified" : "");

          if (!isSpeciesLevel) {
            const status = document.createElement("p");
            status.className = "match-status";
            const errorIcon = document.createElement("span");
            errorIcon.setAttribute("aria-hidden", "true");
            errorIcon.textContent = "❌ ";
            status.append(errorIcon, document.createTextNode("Not identified to species level"));
            matchContext.appendChild(status);
          }

          if (conflictingMatches.length) {
            const warning = document.createElement("p");
            warning.className = "match-warning";
            const warningIcon = document.createElement("span");
            warningIcon.setAttribute("aria-hidden", "true");
            warningIcon.textContent = "⚠️ ";
            warning.append(
              warningIcon,
              document.createTextNode(isSpeciesLevel
                ? (catalogDataPartial
                  ? "Same sequence also has different species-level IDs in the current preview:"
                  : "Same sequence also has different species-level IDs (including global results):")
                : (catalogDataPartial
                  ? "Species-level IDs among matches in the current preview:"
                  : "Species-level IDs among sequence matches (including global results):"))
            );
            matchContext.appendChild(warning);
          }

          if (displayedMatches.length) {
            if (!isSpeciesLevel) {
              const listHeading = document.createElement("p");
              listHeading.className = "match-status";
              listHeading.textContent = catalogDataPartial
                ? "Matching observations in the current preview:"
                : "Matching observations:";
              matchContext.appendChild(listHeading);
            }
            const matchList = document.createElement("ul");
            matchList.className = "match-records";
            displayedMatches.slice(0, 5).forEach(match => {
              const item = document.createElement("li");
              const link = document.createElement("a");
              link.href = "https://www.inaturalist.org/observations/" +
                encodeURIComponent(match.id);
              link.target = "_blank";
              link.rel = "noopener";
              const matchName = match.taxon?.name || match.species_guess || "Unknown identification";
              link.textContent = matchName + " (iNaturalist observation #" + match.id + ")";
              item.appendChild(link);
              matchList.appendChild(item);
            });
            if (displayedMatches.length > 5) {
              const remaining = document.createElement("li");
              remaining.textContent = (displayedMatches.length - 5) +
                " more matching observations; use “Show all genetic matches” to review them.";
              matchList.appendChild(remaining);
            }
            matchContext.appendChild(matchList);
          }

          card.querySelector(".card-content h3").after(matchContext);
        }

        if (!globalSequenceResults) {
          if (sequenceSummary.count > 1 || globalMatchState?.status === "matches") {
            const sequenceButton = document.createElement("button");
            sequenceButton.type = "button";
            sequenceButton.className = "sequence-match-button";
            sequenceButton.textContent = catalogDataPartial
              ? "Caching: global matches unavailable"
              : "Show all genetic matches";
            sequenceButton.title = catalogDataPartial
              ? "Wait for the full catalog to finish caching before viewing global matches."
              : "Find all iNaturalist observations with this ITS sequence";
            sequenceButton.disabled = catalogDataPartial;
            sequenceButton.addEventListener("click", async () => {
              if (loading || catalogDataPartial) return;
              const sequenceInput = document.getElementById("sequenceFilter");
              const locationInput = document.getElementById("locationFilter");
              sequenceInput.value = sequence;
              locationInput.value = "";
              selectedPlaceId = null;
              document.getElementById("placeSuggestions").hidden = true;
              saveSearchToHistory();
              sequenceButton.disabled = true;
              if (catalogMode) {
                globalSequenceResults = true;
                globalSequence = sequence;
                page = 1;
                renderObservations();
                updateMoreButton();
                sequenceButton.disabled = false;
                sequenceButton.textContent = "Show all genetic matches globally";
                return;
              }

              setLoading(true, "Loading genetic matches...");
              try {
                const matches = await fetchSequenceMatches(sequence, (loaded, total) => {
                  sequenceButton.textContent = "Loading matches: " + loaded + " of " + total;
                });
                if (!matches.records.length) {
                  globalSequenceStates.set(sequence, {
                    status: matches.totalMatches === 1 ? "only" : "none",
                    checkedAt: Date.now()
                  });
                  renderObservations();
                  updateMoreButton();
                  return;
                }

                observations = matches.records;
                observationDataVersion++;
                totalSearchResults = matches.totalResults;
                globalSequenceResults = true;
                globalSequence = sequence;
                globalSequenceCheckQueue.length = 0;
                page = 1;
                renderObservations();
                updateMoreButton();
              } catch (error) {
                showStatusError("Error loading global genetic matches: " + error.message);
              } finally {
                setLoading(false);
                if (sequenceButton.isConnected) {
                  sequenceButton.disabled = false;
                  sequenceButton.textContent = "Show all genetic matches globally";
                }
              }
            });
            card.querySelector(".observation-location").after(sequenceButton);
          } else {
            const noMatches = document.createElement("p");
            noMatches.className = "no-genetic-matches";
            noMatches.textContent = globalMatchState?.status === "checking"
              ? "Checking for genetic matches..."
              : globalMatchState?.status === "only"
                ? "No genetic sequence matches found"
                : globalMatchState?.status === "error"
                  ? "Could not check global genetic matches: " + globalMatchState.message
                : "No genetic matches found";
            card.querySelector(".observation-location").after(noMatches);
          }
        }
      }
      results.appendChild(card);
    });

  notifyReviewHost({
      type: "review-content-updated",
      category: reviewCategory,
      count: reviewResultCount
  });
  notifyReviewHost({ type: "review-content-height", height: document.documentElement.scrollHeight });
  return matchingObservations.length;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function nextPage() {
  if (reviewMode) {
    return;
  }
  page++;
  if (globalSequenceResults) {
    renderObservations();
    updateMoreButton();
    return;
  }
  loadObservations(false);
}

document.getElementById("search").addEventListener("input", event => {
  taxonSearchRequest++;
  selectedTaxonId = null;
  selectedTaxonName = "";
  clearTimeout(taxonSearchTimer);
  const query = event.target.value.trim();
  if (query.length < 2) {
    document.getElementById("taxonSuggestions").hidden = true;
    return;
  }
  taxonSearchTimer = setTimeout(() => searchTaxa(query), 300);
});
document.getElementById("observationIds").addEventListener("input", refreshDisplayedResults);
document.getElementById("sequenceFilter").addEventListener("input", refreshDisplayedResults);
document.getElementById("sortFilter").addEventListener("change", refreshDisplayedResults);
document.getElementById("matchThreshold").addEventListener("change", event => {
  matchThreshold = Number(event.target.value);
  refreshDisplayedResults();
});
document.getElementById("resultsPerPage").addEventListener("change", event => {
  resultsPerPage = Number(event.target.value);
  saveSearchToHistory();
  if (globalSequenceResults || reviewMode || catalogMode) {
    page = 1;
    renderObservations();
    updateMoreButton();
  } else if (searchHasBeenSubmitted) {
    loadObservations();
  }
});

document.getElementById("locationFilter").addEventListener("input", event => {
  selectedPlaceId = null;
  clearTimeout(placeSearchTimer);
  const query = event.target.value.trim();
  if (query.length < 2) {
    document.getElementById("placeSuggestions").hidden = true;
    return;
  }
  placeSearchTimer = setTimeout(() => searchPlaces(query), 300);
});

document.getElementById("observerFilter").addEventListener("input", event => {
  selectedObserverId = null;
  selectedObserverLogin = "";
  clearTimeout(userSearchTimer);
  const query = event.target.value.trim();
  if (query.length < 2) {
    document.getElementById("userSuggestions").hidden = true;
    return;
  }
  userSearchTimer = setTimeout(() => searchUsers(query), 300);
});

document.getElementById("projectFilter").addEventListener("input", event => {
  selectedProjectId = null;
  selectedProjectTitle = "";
  clearTimeout(projectSearchTimer);
  const query = event.target.value.trim();
  if (query.length < 2) {
    document.getElementById("projectSuggestions").hidden = true;
    return;
  }
  projectSearchTimer = setTimeout(() => searchProjects(query), 300);
});

document.addEventListener("click", event => {
  if (!event.target.closest(".taxon-control")) {
    document.getElementById("taxonSuggestions").hidden = true;
  }
});

restoreSearchFromUrl();
const sharedObservationIdParam = initialPageParams.get("observation_id");
if (sharedObservationIdParam !== null) {
  const linkedId = sharedObservationIdParam.trim();
  const numericId = Number(linkedId);
  if (!/^\d+$/.test(linkedId) || !Number.isSafeInteger(numericId) || numericId <= 0) {
    showStatusError("This share link contains an invalid observation ID.");
  } else {
    sharedObservationId = String(numericId);
    document.getElementById("observationIds").value = sharedObservationId;
    searchHasBeenSubmitted = true;
    loadObservations();
  }
} else if (reviewMode) {
  loadObservations();
}
</script>
</body>
</html>
